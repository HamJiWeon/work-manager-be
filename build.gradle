plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'work'
version = '0.0.1-SNAPSHOT'
description = 'manager-be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // DB
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
}

/**
 * Test 타입을 명시하고 JUnit Platform으로 테스트한 뒤 커버리지 리포트를 생성한다.
 */
tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

/**
 * QueryDSL과 MapStruct 생성 소스에 대응하는 클래스만 보고서와 검증에서 함께 제외한다.
 */
def coverageClasses = providers.provider {
    def generatedSourceRoot = layout.buildDirectory.dir('generated/sources/annotationProcessor/java/main').get().asFile
    def generatedClassPatterns = fileTree(generatedSourceRoot).matching {
        include '**/Q*.java', '**/*MapperImpl.java'
    }.files.collectMany { generatedSource ->
        def classPath = generatedSourceRoot.toPath().relativize(generatedSource.toPath())
                .toString().replace(File.separator, '/').replaceAll(/\.java$/, '')
        ["${classPath}.class", "${classPath}\$*.class"]
    }
    sourceSets.main.output.classesDirs.asFileTree.matching {
        exclude generatedClassPatterns
    }
}

/**
 * 테스트 실행 결과로 Codecov용 XML과 로컬 확인용 HTML 리포트를 생성한다.
 */
tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    classDirectories.setFrom(coverageClasses)

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

/**
 * 자동 생성 코드를 제외한 라인 커버리지가 80% 미만이면 검증을 실패시킨다.
 */
tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(coverageClasses)

    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

/**
 * check 및 build 실행 시 테스트 커버리지 기준을 검증한다.
 */
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
