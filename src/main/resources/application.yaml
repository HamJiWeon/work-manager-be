spring:
  application:
    name: manager-be
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true
security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 15m
    refresh-token-expiration: 14d
    refresh-token-retention: 7d
    refresh-token-cleanup-cron: "0 0 3 * * *"
    secure-cookie: true
