name: manager-be

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: manager
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
